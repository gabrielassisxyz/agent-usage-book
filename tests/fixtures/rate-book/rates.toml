# The initial dated rate book, imported as structured records by
# `aub rate-card import` (PLAN.md section 32: the existing API price table,
# with its date comments become structured effective intervals and
# publication references).
#
# Anthropic rows were read 2026-06-24 from the claude-api reference.
# OpenAI rows were read 2026-08-14 from `bunx tokscale pricing` (LiteLLM).
# The claude-sonnet-5 introductory rows expire 2026-08-31 and carry the
# review-due date the expiry defines.
#
# Rates are USD per million tokens; cache-write classes carry the absolute
# price for their TTL, never a multiplier of another rate.

