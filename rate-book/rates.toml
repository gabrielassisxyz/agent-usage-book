# The sourced rate book this repository ships: one row per vendor, model and
# token class, each carrying the page it was read from and the date it was read.
# This is the book the operator imports (`aub rate-card import
# rate-book/rates.toml`). The book under `tests/fixtures/rate-book/` is test
# data for the import contract and is not imported anywhere real.
#
# A vendor price change is a new dated row imported alongside the old one, never
# an edit in place: editing a rate in place silently revalues historical traffic.
#
# THE RULES THIS BOOK IS WRITTEN UNDER
#
# 1. `model` is the id as the ledger stores it for Anthropic and OpenAI, because
#    valuation looks a rate up by the event's own model string. Hence
#    `claude-haiku-4-5-20251001` rather than `claude-haiku-4-5`, and
#    `gpt-5.6-terra` rather than `gpt-5.6`. For Ollama the id is Ollama's own;
#    the litellm aliases the pi harness records reach these rows through the
#    model mapping, which lands separately. Until it does, an event naming an
#    alias stays unvalued rather than being valued at a guessed row.
# 2. `vendor` is `ollama` for everything served through Ollama Cloud and
#    litellm, because Ollama's per-token table is what the subscription credits
#    burn at. The upstream vendors publish their own list prices (DeepSeek has
#    its own peak and off-peak windows, Z.ai runs a promotion, MiniMax prices by
#    context length); none of them is what this machine is billed at, so none is
#    a row here.
# 3. `effective_start` is the date the price was read unless the vendor's own
#    page states an earlier date. A price read today is not claimed for August.
#    The one dated exception is `gpt-5.6-sol`, cut on 2026-08-21 per OpenAI's
#    own announcement, whose rows start then.
# 4. OpenAI and Ollama publish no separate cache-write price: a cache write
#    bills as input. Their models therefore carry `input`, `cache_read` and
#    `output` and no `cache_write_*` row. This is not a gap the cost model has
#    to report, because a missing term against a zero count is not a missing
#    fact.
# 5. Time-of-day pricing cannot be expressed by a date-effective row. Ollama
#    doubles both DeepSeek models inside its peak window (12:00 to 18:00 UTC,
#    Monday to Friday: deepseek-v4-flash 0.44 / 0.014 / 1.32 and deepseek-v4-pro
#    1.32 / 0.044 / 3.96 per million tokens). The rows below carry the off-peak
#    rate, so traffic inside that window is valued low. A peak-aware term is out
#    of scope here and needs a rate shape that has a schedule in it.
# 6. `claude-sonnet-5` carries one open-ended row per class at 2.00 / 10.00,
#    starting 2026-06-24, and no standard-price rows. The introductory pricing
#    the fixture recorded as expiring on 2026-08-31 does not expire: Anthropic's
#    page as read on 2026-09-07 states the increase will not occur.
#
# WHICH MODELS HAVE NO RATE BEFORE THE READ DATE, AND WHY
#
# Every row whose `effective_start` is 2026-09-07 or 2026-09-09 was read on that
# day and is not claimed for any earlier traffic, per rule 3. That is every
# OpenCode and Ollama row, every OpenAI row except `gpt-5.6-sol`, and four
# Anthropic models: `claude-fable-5-1`, `claude-mythos-5-1`,
# `claude-opus-4-5-20251101` and `claude-sonnet-4-6`. Events from those models
# before their start date stay unvalued, which is the intended outcome: the
# price on those days was not recorded, and inventing one would produce a number
# nothing can justify.
#
# The five Ollama models read 2026-09-09 rather than 2026-09-07
# (`mistral-large-3`, `nemotron-3-nano`, `nemotron-3-super`, `nemotron-3-ultra`,
# `qwen3.5:397b`) were named in the source that produced this book but arrived
# without figures, so their prices come from a second read of the same page two
# days later. Every row the two reads have in common was identical, so the later
# read is an extension of the book rather than a correction to it.
#
# WHAT THE SHAPE OF A CARD CANNOT SAY
#
# OpenCode publishes a single cache-write price where it publishes one at all.
# There is no 5m and 1h distinction to record, so that one price is written to
# both TTL classes and those rows say so in `source`. A context-length tier
# (Luna above 272K, Qwen Plus above 256K) is not expressible either, and the base
# tier is what the row carries. The `Usage` column on the OpenCode page is a
# credit-consumption multiplier rather than a per-token price, and is not
# imported.
#
# Three Ollama models (`mistral-large-3`, `nemotron-3-nano`, `qwen3.5:397b`) have
# no cached-input price on the page, so they carry `input` and `output` only. The
# absent class is the vendor's fact, not an omission here.
#
# Ollama's own catalog tags two of those ids with a parameter count
# (`mistral-large-3:675b`, `nemotron-3-nano:30b`) where the pricing page does
# not. The page's spelling is what these rows use, matching every other Ollama
# row in this file; an event carrying the tagged spelling reaches its rate
# through the model mapping.

