[package]
name = "agent-usage-book"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "One ledger for LLM consumption: token spend read from local transcripts, quota measured at the provider."
license = "MIT"
repository = "https://github.com/gabrielassisxyz/agent-usage-book"
readme = "README.md"
keywords = ["llm", "quota", "tokens", "observability", "cli"]
categories = ["command-line-utilities"]

# The crate is named for what it is; the command is named for what gets typed.
[lib]
name = "agent_usage_book"
path = "src/lib.rs"

[[bin]]
name = "aub"
path = "src/main.rs"

[dependencies]
# The first real production dependency this crate takes (aub-sth.1): parsing the
# configuration file's TOML format by hand would mean re-deriving a spec this crate
# has no stake in getting subtly wrong. Used only for its dynamic `Table`/`Value`
# API (`toml::Table: FromStr`), never for `#[derive(Deserialize)]` on this crate's own
# types: per-key provenance and unknown-key detection both need to walk the parsed
# tree by hand, which a derive-based deserializer would not give us for free.
toml = "1"
# The bundled SQLite build (aub-sth.3): the store layer's one persistence
# dependency. Bundled so behaviour does not depend on the host's SQLite version
# (AGENTS.md "Persistence"; PLAN.md section 11.2). Only src/store/ may reference
# it; bin/checks/boundary-rules/11-store-connections-through-one-function
# enforces that every connection goes through the one setup function.
rusqlite = { version = "0.32", features = ["bundled"] }
# The blocking HTTP client (aub-eun.2): wrapped behind an owned interface in
# src/meter/transport.rs with explicit timeouts and command budget. No async
# runtime is pulled in.
ureq = "2"

[dev-dependencies]
trybuild = "1"
test-support = { path = "crates/test-support" }

[profile.release]
strip = true
