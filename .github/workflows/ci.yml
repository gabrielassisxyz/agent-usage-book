name: ci

on:
  push:
    branches: [main]
  pull_request:
    # `edited` is load-bearing: without it the PR-text scan only reruns on the next push
    # and reads that event's payload, so a body fixed afterwards still fails and a body
    # edited afterwards to add a tell passes.
    types: [opened, synchronize, reopened, edited]

jobs:
  ci:
    # A title or body edit changes no code, so the expensive job opts out of it.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: bin/ci

  gitleaks:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks CLI, not gitleaks-action: same binary and same rules as the
      # pre-commit hook, and no write token to grant.
      - name: Secret scan (full history)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact

  slop-guard-pr:
    # The PR title and body never touch the git tree, so bin/ci cannot see them.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: PR text has no slop
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s\n' "$TITLE" "$BODY" | bin/slop-guard --stdin "PR text"
