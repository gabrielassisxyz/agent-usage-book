name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  upload:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-13
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Every target builds on a runner of its own architecture. Cross-compiling would
      # mean carrying a C toolchain per target as soon as a dependency bundles C sources,
      # and the runners to avoid that are free for a public repository.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: aub
          target: ${{ matrix.target }}
          archive: $bin-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
